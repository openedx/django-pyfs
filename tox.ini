[tox]
envlist = python{312}-django{42, 52},quality
requires = tox-uv>=1

[testenv]
runner = uv-venv-lock-runner
passenv =
    CI
    TRAVIS
    TRAVIS_*
dependency_groups =
    django42: django42
    django52: test
allowlist_externals = make
commands =
    make test
    python -m coverage html

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
allowlist_externals = make
commands =
    make quality

[pycodestyle]
max-line-length=130
exclude=.git
